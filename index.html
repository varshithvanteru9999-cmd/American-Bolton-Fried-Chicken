<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Use the admin manifest on /admin routes so the installed admin app
      // launches into the dashboard (separate from the customer app). Runs
      // before the browser evaluates installability.
      if (location.pathname.indexOf('/admin') === 0) {
        document.write('<link rel="manifest" href="/admin.webmanifest">');
      }
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F6F1" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load Poppins without blocking render (display serif used for headings) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" /></noscript>
    <!-- Preload the hero backdrop (the LCP image) so it downloads in parallel
         with the JS. These are the images the app actually renders; the old
         banner-*.webp preloads pointed at the previous shop's artwork. -->
    <link rel="preload" as="image" href="/images/afc-bg-mobile.webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/afc-bg-desktop.webp" media="(min-width: 769px)" fetchpriority="high" />
    <!-- Start the Firebase/Firestore network handshakes early -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <title>American Fried Chicken Ltd — Bolton</title>
    <!-- Critical CSS for the instant-paint shell.
         The shell used to render the old banner artwork, which flashed the
         previous shop's branding on every reload before React mounted. It is
         now a neutral brand-coloured placeholder: no imagery, nothing that can
         go stale, and no layout shift when the real hero replaces it. -->
    <style>
      body { margin: 0; background: #F8F6F1; font-family: 'Inter', Arial, sans-serif; }
      #app-shell { background: #F8F6F1; }
      #app-shell .sh-nav { background: #FFFFFF; height: 68px; border-bottom: 1px solid #E8E3D9; }
      #app-shell .sh-banner {
        height: 520px;
        background: linear-gradient(180deg, #EFEBE2 0%, #F8F6F1 100%);
      }
      @media (max-width: 768px) {
        #app-shell .sh-nav { display: none; }
        #app-shell .sh-banner { height: 76vw; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static above-the-fold shell: reserves the nav and hero space so the
           page has its final shape before the app JS runs, avoiding a layout
           shift on mount. Deliberately holds no logo or photography — anything
           pictured here is a second source of truth that goes stale. -->
      <div id="app-shell" aria-hidden="true">
        <div class="sh-nav"></div>
        <div class="sh-banner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
